<!DOCTYPE html>
<html>
<head>
    <title>Our Love Portal ❤️</title>

    <style>
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            margin-top: 120px;
        }

        input {
            padding: 12px;
            border-radius: 20px;
            border: none;
            width: 240px;
            text-align: center;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            border-radius: 20px;
            border: none;
            background-color: #ffffff;
            color: #ff4b5c;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .emoji {
            font-size: 100px;
            margin-top: 20px;
        }

        /* Pig bounce animation */
        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
            100% { transform: translateY(0); }
        }

        /* Cry shake animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .bounce {
            animation: bounce 1s infinite;
        }

        .shake {
            animation: shake 0.5s infinite;
        }

        iframe {
            width: 90%;
            height: 800px;
            border-radius: 15px;
            margin-top: 30px;
            border: none;
        }

        h1 {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<!-- PAGE 1 : NAME -->
<div class="container" id="page1">
    <h1>This space belongs to someone special 💕</h1>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <br>
    <button onclick="checkName()">Continue</button>
</div>

<!-- PAGE 2 : DATE -->
<div class="container hidden" id="page2">
    <h1>The Day Everything Changed 💫</h1>
    <p>Hint: The day two introverts became one story…</p>
    <input type="text" id="dateInput" placeholder="DD/MM/YYYY">
    <br>
    <button onclick="checkDate()">Unlock Our Story</button>

    <div id="resultArea"></div>
</div>

<!-- PAGE 3 : PDF -->
<div class="container hidden" id="page3">
    <h1>AJJI : THE BOOK 📖❤️</h1>
    <iframe src="AJJJI.pdf"></iframe>
</div>

<script>

    function checkName() {
        var name = document.getElementById("nameInput").value.toLowerCase().trim();

        if (name === "ajji") {
            document.getElementById("page1").style.display = "none";
            document.getElementById("page2").style.display = "block";
        } else {
            alert("Only my AJJI can enter this world 😌💕");
        }
    }

    function checkDate() {
        var date = document.getElementById("dateInput").value.trim();
        var resultArea = document.getElementById("resultArea");

        if (date === "29/11/2024") {

            resultArea.innerHTML =
                "<div class='emoji bounce'>🐷</div>" +
                "<h2>Correct! My little piggie remembered 😌💕</h2>";

            setTimeout(function() {
                document.getElementById("page2").style.display = "none";
                document.getElementById("page3").style.display = "block";
            }, 2500);

        } else {

            resultArea.innerHTML =
                "<div class='emoji shake'>😭</div>" +
                "<h3>Handiii kaa mussudi kissie kodtheni 😌💋<br>Correct agi nenap madkari!</h3>";
        }
    }

</script>

</body>
</html>
